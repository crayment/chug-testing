name: Validate Changelog Entry (pre-release)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: crayment/chug@main
        with:
          source: repo
      - run: chug validate
        shell: bash
