name: Update Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string for the changelog release section.
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: crayment/chug@main
      - name: Capture release notes
        id: release_notes
        shell: bash
        run: |
          NOTES=$(chug preview)
          echo "notes<<CHUG_RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "CHUG_RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"

      - name: Run chug release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chug release --version "${{ inputs.version }}"
      - name: Commit and push changelog
        id: commit_changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git add -A changes/ || true
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "Update changelog for ${{ inputs.version }}"
            git push
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ steps.commit_changelog.outputs.commit_sha }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "## Release Notes"$'\n\n'"$RELEASE_NOTES" \
            --generate-notes \
            --target "$COMMIT_SHA"
